# Fixture applied by boot/reload_test.go's end-to-end reload test : a
# single new route function, proving a request against the schema a reload
# just created succeeds where it would have 404'd before.

fn_created_by_migration:
  sql:
    - |
      create function fn_created_by_migration() returns text language sql as $$
        select 'from migration'::text;
      $$;
    - |
      comment on function fn_created_by_migration() is 'route:: path: "/created"';
    - |
      -- route.applyAnonymousAuthorization requires an explicit grant, never
      -- one credited only via PUBLIC's own CREATE FUNCTION default (specs/
      -- route.md ## Anonymous route authorization). No parens on the
      -- function name : dmut's auto-down parser for "grant ... on function"
      -- expects a bare identifier, and Postgres accepts that unqualified
      -- form when the name isn't overloaded.
      grant execute on function fn_created_by_migration to "~anonymous";
