# yaml-embedded-languages: sql
#
# Test-purpose : exercises the OUT-argument-mode introspection path, which is
# the uncommon case (proallargtypes/proargmodes only populate for OUT/INOUT/
# VARIADIC/TABLE) — complements the plain-IN regression test in pg/.

hotel.split_name:
  needs: [hotel]
  meta:
    # Explicit up/down rather than relying on auto-down : dmut's auto-down for
    # CREATE FUNCTION incorrectly includes OUT-mode parameters in the DROP
    # FUNCTION signature, but Postgres's function signature for DROP purposes
    # only includes IN/INOUT/VARIADIC parameters — verified directly, this is
    # a dmut bug (separate repo, github.com/ceymard/dmut/v2), not a mistake
    # here. Worked around rather than fixed, since it's out of scope for rel.
    - up: |
        create function hotel.split_name(full_name text, out first_name text, out last_name text)
        language sql immutable strict as $$
          select split_part(full_name, ' ', 1), split_part(full_name, ' ', 2)
        $$;
      down: |
        drop function hotel.split_name(text);
